[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finegrained-region-discovery"
version = "0.1.0"
description = "Route B fine-grained referring-expression discovery pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.2",
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["modelscope>=1.20", "pandas>=2.2", "pyarrow>=15"]
qwen-client = ["transformers>=5.5.3", "accelerate>=1.3"]
dev = ["ruff>=0.6"]

[tool.setuptools]
packages = [
  "src", "src.utils", "src.models", "src.grounding", "src.routes",
  "src.regions", "src.visualization"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001"]
